name: Build & Publish Release APK

on:
  push:
    tags:
      - 'v*'
      - 'release*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. release2.0-stable)'
        required: true
        default: 'release2.0-stable'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug

      - name: Prepare Release APK Artifacts
        run: |
          mkdir -p release_assets
          TAG="${{ github.ref_name || github.event.inputs.tag_name || 'release2.0-stable' }}"
          cp app/build/outputs/apk/release/app-release.apk release_assets/VCodec-${TAG}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release_assets/VCodec-${TAG}-debug.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || github.event.inputs.tag_name }}
          name: "VCodec ${{ github.ref_name || github.event.inputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
