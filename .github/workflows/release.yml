name: Build & Publish Release APK

on:
  push:
    branches: ['**']
    tags: ['v*', 'release*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v2.1.0). Empty = build only.'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Channel resolution:
      #   push to main / tag push -> stable (VCodec-vX.Y.Z-stable.apk)
      #   push to feature/* or any other branch -> dev (VCodec-vX.Y.Z-dev.apk)
      - name: Determine channel & version
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -n "$TAG" ]; then CHANNEL=stable; else CHANNEL=dev; fi
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            CHANNEL=stable
            TAG="${{ github.ref_name }}"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            CHANNEL=stable
            TAG=""
          else
            CHANNEL=dev
            TAG=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "suffix=$VERSION-$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "apk_name=VCodec-v$VERSION-$CHANNEL.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "WARNING: KEYSTORE_BASE64 secret is not set. Release APK will be signed with an ephemeral debug key and CANNOT update an installed app."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vcodec-release.keystore"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/vcodec-release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_KEYSTORE_PASSWORD=VCodecReleaseSign2026" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=vcodec" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=VCodecReleaseSign2026" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --parallel --build-cache --stacktrace 2>&1 | tee build_test_output.log

      - name: Build Release APK
        if: success()
        run: |
          set -o pipefail
          ./gradlew assembleRelease --parallel --build-cache --stacktrace 2>&1 | tee build_apk_output.log

      - name: Prepare APK artifact
        run: |
          mkdir -p release_assets
          APK_NAME="${{ steps.meta.outputs.apk_name }}"
          cp app/build/outputs/apk/release/app-release.apk "release_assets/${APK_NAME}"
          ls -la release_assets

      # Testable APK is ALWAYS uploaded as artifact, on every branch and every push
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: VCodec-APK-${{ steps.meta.outputs.suffix }}
          path: release_assets/*.apk
          if-no-files-found: error

      - name: Publish failure diagnostics to job summary
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Build failure report"
            for f in build_test_output.log build_apk_output.log; do
              if [ -f "$f" ]; then
                echo "### $f (errors)"
                echo '```'
                grep -nE "error:|Error:|FAILED|FAILURE|Exception|e: " "$f" | head -100 || echo "(no matches)"
                echo '```'
                echo "### tail of $f"
                echo '```'
                tail -60 "$f" || true
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

          # Mirror key error lines into annotations (readable via API)
          for f in build_test_output.log build_apk_output.log; do
            if [ -f "$f" ]; then
              grep -E "error:|e: |FAILURE|Exception" "$f" | head -25 | while IFS= read -r line; do
                echo "::error::${line:0:500}"
              done
            fi
          done
          exit 0

      - name: Create failure issue with full logs
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$(pwd)/ci_failure_body.md"
          {
            echo "CI failed on commit ${GITHUB_SHA} (${GITHUB_REF_NAME})"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            for f in build_test_output.log build_apk_output.log; do
              if [ -f "$f" ]; then
                echo "## tail of $f"
                echo '```'
                tail -c 25000 "$f" || true
                echo
                echo '```'
              fi
            done
          } > "$BODY"
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "CI build failure (${GITHUB_SHA::7})" \
            --body-file "$BODY" || true

      # Stable release on main or tag
      - name: Create Stable GitHub Release
        if: ${{ steps.meta.outputs.channel == 'stable' && (steps.meta.outputs.tag != '' || github.ref_name == 'main') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag != '' && steps.meta.outputs.tag || format('v{0}', steps.meta.outputs.version) }}
          name: "VCodec v${{ steps.meta.outputs.version }} (stable)"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Dev pre-release on feature branches (starts with feature/ or manual dispatch)
      - name: Create Dev GitHub Pre-Release
        if: ${{ steps.meta.outputs.channel == 'dev' && (startsWith(github.ref_name, 'feature') || steps.meta.outputs.tag != '') }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag != '' && steps.meta.outputs.tag || format('v{0}-dev', steps.meta.outputs.version) }}
          name: "VCodec v${{ steps.meta.outputs.version }} (dev)"
          draft: false
          prerelease: true
          generate_release_notes: true
          files: |
            release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
